<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Quiz Kanji</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Quiz di Giapponese</h1>
  <p class="total-count">Kanji totali: <span id="totalCount">0</span></p>
  <div class="card">
    <p class="info"><strong>Italiano:</strong> <span id="italiano"></span></p>
    <p class="info"><strong>Hiragana:</strong> <span id="hiragana"></span></p>
    <div class="buttons">
      <button id="showBtn">Mostra</button>
    </div>

    <div id="kanjiContainer">
      <div id="svgWrapper"></div>
      <div class="buttons">
        <button id="nextBtn" style="display:none;">Avanti</button>
      </div>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/vivus@latest/dist/vivus.min.js"></script>
<script>
    let parole = [];
    let parolaCorrente = null;
    let vivusInstance = null; 

    async function caricaParole() {
        const res = await fetch('parole.json');
        parole = await res.json();
        
        const conteggioTotale = parole.length;
        document.getElementById('totalCount').textContent = conteggioTotale; 

        mostraNuovaParola();
    }

    function mostraNuovaParola() {
        parolaCorrente = parole[Math.floor(Math.random() * parole.length)];
        document.getElementById('italiano').textContent = parolaCorrente.italiano;
        document.getElementById('hiragana').textContent = parolaCorrente.hiragana;
        document.getElementById('svgWrapper').innerHTML = '';

        const kanjiContainer = document.getElementById('kanjiContainer');
        kanjiContainer.style.height = '0';
        kanjiContainer.style.overflow = 'hidden';
        kanjiContainer.style.padding = '0';
        
        document.getElementById('showBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').style.display = 'none';

        const svgElement = document.getElementById('kanjiSVG');
        if (svgElement) {
            svgElement.replaceWith(svgElement.cloneNode(true));
        }
    }

    function kanjiToFilename(kanji) {
        return formatUnicode(kanji.charCodeAt(0)) + '.svg';
    }

    function formatUnicode(code) {
        return code.toString(16).padStart(5, '0');
    }

    async function mostraKanji() {
        const filename = kanjiToFilename(parolaCorrente.kanji);
        const res = await fetch(`kanji/${filename}`);
        const svgText = await res.text();
        document.getElementById('svgWrapper').innerHTML = svgText;
        const svgElement = document.querySelector('#svgWrapper svg');

        svgElement.removeAttribute('width'); 
        svgElement.removeAttribute('height'); 
        svgElement.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        svgElement.setAttribute('id', 'kanjiSVG');
        svgElement.style.cursor = 'pointer';

        const kanjiContainer = document.getElementById('kanjiContainer');
        kanjiContainer.style.height = 'auto'; 
        kanjiContainer.style.overflow = 'visible';
        kanjiContainer.style.padding = '15px 0'; 
        vivusInstance = new Vivus('kanjiSVG', { type: 'delayed', duration: 200, animTimingFunction: Vivus.EASE });
        svgElement.addEventListener('click', () => {
            if (vivusInstance) {
                vivusInstance.reset().play();
            }
        });

        document.getElementById('showBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'inline-block';
    }

    document.getElementById('showBtn').addEventListener('click', mostraKanji);
    document.getElementById('nextBtn').addEventListener('click', mostraNuovaParola);
    caricaParole();
</script>
</body>
</html>
